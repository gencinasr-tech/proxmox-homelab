arch: amd64
cores: 1
features: nesting=1
hostname: TailScale
memory: 1024
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.1.1,hwaddr=BC:24:11:19:E7:56,ip=192.168.1.87/24,type=veth
net1: name=eth1,bridge=vmbr10,firewall=1,hwaddr=BC:24:11:FF:54:1B,ip=10.10.10.87/24,type=veth
